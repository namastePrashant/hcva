name: Deploy to Cloudflare Workers

# Manual fallback only. The primary CI is Cloudflare Workers Builds (connected to
# this repo, deploys the "hcva" Worker on every push to main). Keep this on
# workflow_dispatch so the two systems never deploy the same Worker at once.
# Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Worker
        run: npm run build
        env:
          SITE_ORIGIN: https://humanitariancva.org

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Config + entry come from dist/server/wrangler.json via the
          # .wrangler/deploy/config.json redirect written by `npm run build`.
          command: deploy
